[project]
name = "dftw"
version = "0.0.1"
description = "Orchestration CLI for dftracer-workloads"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pyyaml>=6", "questionary>=2"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
docs = ["sphinx>=7,<9", "myst-parser>=2", "furo>=2024.1", "sphinx-copybutton>=0.5", "sphinx-design>=0.5"]

[project.scripts]
dftw = "dftw.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
